function u16(n){return String.fromCharCode(n&255,(n>>>8)&255)}function u32(n){return String.fromCharCode(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255)}

function inlineMd(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')}
function mdToHtml(md){var lines=String(md||'').replace(/\r\n/g,'\n').split('\n'),html='',inList=false,inTable=false,table=[];function closeList(){if(inList){html+='</ul>';inList=false}}function closeTable(){if(!inTable)return;html+='<div class="table-wrap"><table>';for(var i=0;i<table.length;i++){var cells=table[i].split('|').slice(1,-1).map(function(c){return c.trim()});if(i===1&&cells.every(function(c){return /^:?-{3,}:?$/.test(c)}))continue;html+='<tr>'+(i===0?cells.map(function(c){return '<th>'+inlineMd(c)+'</th>'}).join(''):cells.map(function(c){return '<td>'+inlineMd(c)+'</td>'}).join(''))+'</tr>'}html+='</table></div>';inTable=false;table=[]}for(var i=0;i<lines.length;i++){var line=lines[i].trimEnd();if(!line){closeList();closeTable();continue}if(/^```/.test(line)){continue}if(/^\|.*\|$/.test(line)){closeList();inTable=true;table.push(line);continue}closeTable();if(/^#{1,6}\s+/.test(line)){closeList();var lv=line.match(/^#{1,6}/)[0].length;html+='<h'+lv+'>'+inlineMd(line.replace(/^#{1,6}\s+/,''))+'</h'+lv+'>';continue}if(/^[-*]\s+/.test(line)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}closeList();html+='<p>'+inlineMd(line)+'</p>'}closeList();closeTable();return html}

function buildPlan(){
 var issue=q('issue')||'未关联';var solution=q('solution')||'A';var project=q('project')||'au-niv858';var projectName=projectMap[project]||project;
 document.getElementById('meta').textContent='来源：评估结果 Issue #'+issue+' · 已选方案 '+solution;
 document.getElementById('projectPill').textContent=projectName;
 document.getElementById('summary').innerHTML='本执行策划案按客户交付版模板生成。⚠️ <strong>澳大利亚投资移民（BIIP 188系列）已于2024年7月31日永久关停。</strong>本方案转而分析替代路径：国家创新签证NIV 858（取代原全球人才签证GTI）、186雇主担保（TRT/Direct Entry）、189/190技术移民、482 SID→186转永居路径。';
 var md=`# 澳大利亚移民执行策划案\n\n> 生成日期：2026-06-08  \n> 适用对象：拟通过澳大利亚替代移民路径取得永居身份的高净值家庭/企业主  \n> 文档版本：客户交付版 V1.0  \n> 重要声明：本策划案为商业规划与执行框架，不构成法律、税务、投资或移民建议；落地前须由MARA注册移民代理或澳大利亚移民律师进行最终确认。\n\n> **⚠️ 关键政策更新：澳大利亚商业创新与投资计划（BIIP，含188A/188B/188C/188D/188E所有子类别）于2024年7月31日永久关闭，不再接受新申请。** 2024年12月6日起，原全球人才签证（GTI 858）和BIIP被国家创新签证（NIV Subclass 858）取代。已提交的188申请继续审理，但新申请必须走替代路径。\n\n---\n\n## 摘要结论\n\n**传统路径不可用，替代路径有三条：**\n\n**第一，国家创新签证NIV 858（一步到位永居）** — 面向拥有国际公认杰出成就的个人，覆盖关键科技、健康产业、可再生能源等优先领域。无固定投资金额要求，但要求申请人有卓越成就记录、行业知名度和对澳大利亚创新/生产力的重大贡献潜力。适合有重大奖项、学术成就、行业领导地位的企业家/专业人士。\n\n**第二，186雇主担保永居（TRT流或Direct Entry流）** — 适合已有澳大利亚雇主意向或能与澳大利亚企业建立雇佣关系的高管/专业人士。TRT流：持有482 SID签证满2年后转永居（2025改革后无年龄上限）。Direct Entry流：职业在CSOL上+3年经验+职业评估+45岁以下。\n\n**第三，189/190技术移民（打分制）** — 适合有技术职业背景、雅思6分以上、年龄45岁以下且能通过打分系统达到竞争分数的申请人。\n\n本方案的执行重点：第一，188系列关停意味着中国高净值客户的"被动投资拿澳洲身份"路径已彻底关闭——必须调整为主动技能/成就/雇主路径；第二，NIV 858虽然无投资金额门槛，但"杰出成就"门槛极高，不是"有钱就能办"；第三，澳洲永久居留后虽可享受Medicare、本地学费等福利，但部分Centrelink福利有2-4年等待期，入籍需居住满4年（其中PR满12个月）。\n\n## 一、客户家庭基本信息（待补充版）\n\n### 1.1 已知/默认信息\n\n| 项目 | 当前信息 | 状态 |\n|---|---|---|\n| 客户身份 | 中国籍家庭/企业主/高净值客户 | ⚠️ 待确认 |\n| 核心目标 | 取得澳大利亚永久居留身份、子女教育、生活品质 | ⚠️ 待确认 |\n| 预算范围 | 188C路径已关停；替代路径(NIV/186/189)无固定投资门槛，费用主要为签证费+律师费 | ⚠️ 需重新评估 |\n| 家庭成员 | 主申请人、配偶、子女可随行 | ⚠️ 待确认家庭结构与年龄 |\n| 职业/行业背景 | NIV 858需杰出成就；186/189需在CSOL上或通过职业评估 | ❌ 待确认 |\n| 英语能力 | NIV仅需功能性英语；189需雅思6分+；186需雅思5分（482转）或6分（DE） | ❌ 待确认 |\n| 是否有澳大利亚雇主 | 186 Direct Entry和482转186都需要雇主 | ❌ 待确认 |\n| 税务身份 | 澳洲税务居民以居住为主要判断（通常6个月+居住），PR≠自动税务居民 | ⚠️ 待确认 |\n\n### 1.2 待解决问题分级\n\n| 编号 | 问题 | 严重度 | 说明 |\n|---|---|---|---|\n| Q1 | 客户职业/行业背景是否能匹配NIV 858"杰出成就"标准？ | P0 | 如无法满足，NIV路径不适用。 |\n| Q2 | 客户是否有澳大利亚雇主意向？ | P0 | 186/482都需要雇主担保。 |\n| Q3 | 188系列关停后客户是否仍坚持"投资移民"思维？ | P1 | 澳洲已无纯投资移民路径，必须转向技能/成就/雇主路径。 |\n| Q4 | 英语能力 | P1 | 主要路径都需要英语基础。 |\n| Q5 | 年龄限制 | P1 | 技术移民45岁以下；NIV 858无严格上限但需证明特殊贡献。 |\n| Q6 | 子女年龄 | P1 | 随行子女一般为18岁以下或在读23岁以下。 |\n\n### 1.3 根本判断\n\n**表面问题**：客户想移民澳大利亚。  \n**真实问题**：188关停后，"有钱就能移民澳大利亚"的时代已经结束。客户必须重新评估自身条件——是行业杰出者（NIV 858）、有雇主连接（186/482）、还是有技术背景能通过打分系统（189/190）。如果以上都不满足，澳洲路径可行性将大幅降低，建议对比加拿大SUV（2026年将出新试点）、新西兰AIP等替代目的国。\n\n---\n\n## 二、核心策略\n\n### 2.1 三路径对比定位\n\n| 维度 | NIV 858 国家创新 | 186雇主担保TRT | 189独立技术移民 |\n|---|---|---|---|\n| 适合人群 | 行业杰出成就者、获奖者、科研/商业领袖 | 已有澳洲雇主或能获取雇主offer的高管/专业人士 | 有技术职业+英语+高分背景 |\n| 是否需要雇主 | 获澳洲有全国声誉的个人/机构提名(Form 1000) | 需要 | 不需要 |\n| 是否需要投资 | 无固定金额要求 | 无 | 无 |\n| 年龄限制 | 无严格上限（55+需证明特殊利益） | 2025改革后无年龄上限 | 45岁以下 |\n| 英语要求 | 功能性英语（可交费豁免） | 雅思5分起 | 雅思6分+（竞争分需更高） |\n| 审理周期 | 不确定（优先级排序） | 2年482+186审理 | EOI邀请+签证审理 |\n| 签证类型 | 一步到位永居 | 先工签→永居 | 一步到位永居 |\n\n### 2.2 推荐核心路线\n\n**推荐方案：按客户背景三维评估后选择最优路径。**\n\n- 有国际奖项/行业领导地位/学术成就/重大商业影响 → **NIV 858**（最优，一步永居，无年龄上限）\n- 有澳大利亚雇主或可获取雇主 → **482 SID → 186 TRT**（2年后转永居，2025起无年龄上限）\n- 有技术背景+45岁以下+良好英语 → **189/190**（打分制，竞争获取）\n\n---\n\n## 三、合规清理详细方案\n\n### 3.1 资金来源合规（适用于NIV 858或186路径）\n\n| 环节 | 合规要求 | 风险点 | 执行动作 |\n|---|---|---|---|\n| 签证申请费用来源 | 需说明支付签证费用的资金来源 | 现金来源不明 | 保留银行流水、薪资/企业收入证明 |\n| 定居资金证明 | 部分签证可能要求证明有足够定居资金 | 金额不足 | 准备银行存款证明 |\n| 雇主薪资合规（186） | 雇主薪资须达CSOL门槛（$79,499起，2026年7月更新） | 虚假雇主、薪资不达标 | 由移民律师/代理验证雇主资质 |\n\n### 3.2 中国国籍边界\n\n红线：拿到澳大利亚PR后，中国护照仍可使用。入籍澳大利亚后根据《中国国籍法》第9条自动丧失中国国籍。\n\n执行要求：\n- PR期间：中国出入境继续使用中国护照。\n- 入籍后：使用澳大利亚护照国际旅行；中国出入境须遵守中国签证规定。\n- 不在中国境内主动展示澳大利亚护照作为身份证明。\n\n---\n\n## 四、身份路径规划\n\n### 4.1 主推荐路径：国家创新签证NIV 858\n\n| 维度 | 内容 |\n|---|---|\n| 推出时间 | 2024年12月6日，取代原GTI 858和BIIP |\n| 申请条件 | (1)拥有国际公认的杰出和卓越成就记录 (2)在专业领域内有持续知名度 (3)有能力对澳大利亚创新/生产力/竞争力做出重大贡献 (4)须获得有全国声誉的澳大利亚个人或组织提名(Form 1000) (5)须提交EOI并获得邀请 |\n| 投资额 | 无固定投资金额要求 |\n| 年龄 | 无严格上限（18岁以下/55岁以上需证明特殊利益） |\n| 英语 | 功能性英语即可（未达标可交额外费用） |\n| 签证类型 | 永久居留签证（一步到位PR） |\n| 优先领域Tier1 | 关键科技、健康产业、可再生能源与低排放技术 |\n| 优先领域Tier2 | 农业食品/农业科技、国防与太空、教育、金融服务/金融科技、基础设施与交通 |\n| 优先级排序 | ①国际顶级奖项→②政府提名→③Tier1杰出→④Tier2→⑤其他 |\n\n### 4.2 备选路径：186雇主担保（TRT流）\n\n| 维度 | 内容 |\n|---|---|\n| 路径 | 482 SID签证（2年） → 186 TRT永久居留 |\n| 482条件 | 有认证雇主offer、职业在CSOL上、年薪≥$79,499（Core Skills Stream）、雅思总分5分 |\n| 482转186条件 | 持有482满2年，在同一职位为同一雇主全职工作 |\n| 优势 | 2025年改革后转186无年龄上限 |\n| 注意 | 如被解雇有180天找新雇主（旧政60天） |\n\n### 4.3 备选路径：189独立技术移民\n\n| 维度 | 内容 |\n|---|---|\n| 签证类型 | 一步到位永居 |\n| 条件 | 职业在MLTSSL上、职业评估、45岁以下、EOI≥65分（实际竞争75-85+）、英语Competent（雅思6分+） |\n| 2025-26名额 | 16,900个 |\n| 优势 | 无需州担保/雇主，可在全澳自由居住工作 |\n\n### 4.4 入籍条件\n\n| 维度 | 内容 |\n|---|---|\n| 居住要求 | 在澳大利亚合法居住至少4年，其中至少12个月为PR |\n| 离境限制 | 4年内离境总计不超过12个月，最后12个月不超过90天 |\n| 其他 | 通过公民测试（英语+澳洲价值观）、良好品行 |\n\n---\n\n## 五、教育规划\n\n澳大利亚对PR/公民子女的教育福利突出：\n\n| 教育阶段 | PR/公民优势 | 国际生对比 |\n|---|---|---|\n| K-12 | 公立学校免费（部分州PR也覆盖） | 国际生需付费入读公立或私立 |\n| 大学本科 | 本地学费（国际生的1/3-1/5），可申请CSP/HECS-HELP助学贷款 | 全额国际生学费 |\n| 研究生 | 本地学费，可申请研究奖学金 | 国际生学费 |\n| 全球大学排名 | 澳洲八大（Go8）全球知名 | 录取竞争对本地生更友好 |\n\n建议：如果客户核心是子女教育且能走技术/雇主路径，澳洲高性价比的大学教育和安全的生活环境是中产以上家庭的优质选择；但如果客户走不了任何路径（年龄/职业/英语均不满足），建议对比加拿大Express Entry或新西兰Green List。\n\n---\n\n## 六、澳洲PR福利与居住规划\n\n### 6.1 PR福利总览\n\n| 福利类别 | PR状态 | 入籍后 |\n|---|---|---|\n| 医疗(Medicare) | 全面免费公立医疗 | 同左 |\n| 教育 | 本地学费+CSP/HECS-HELP贷款 | 同左 |\n| Centrelink福利 | 居住满2-4年后可申请大部分（失业金、育儿补贴等） | 无等待期 |\n| 养老(Age Pension) | 居住满10年（其中5年连续）后可申请 | 同左 |\n| 首次置业 | 可申请First Home Owner Grant、印花税减免 | 同左 |\n| 就业 | 无限制（除军队/部分公共服务） | 可参军、参公职 |\n| 选举权 | 无 | 有 |\n| 新西兰旅行 | PR可自由在新西兰生活工作（无需签证） | 同左 |\n| PR旅行权 | 5年旅行便利，到期需申请RRV续期 | 无需 |\n\n### 6.2 推荐定位\n\n**澳大利亚 = 高品质生活 + 教育福利 + 全民医保 + PR去新西兰自由。** 但需注意：入籍前无选举权、PR旅行权需续期、部分福利有等待期。适合以"长期居住"和"子女教育"为核心目标的家庭。\n\n---\n\n## 七、税务分析\n\n### 7.1 澳洲税务居民判断\n\n| 情形 | 税务判断 |\n|---|---|\n| 每年在澳居住≥183天 | 通常为澳洲税务居民（除非主要居所在海外+无在澳长期定居意图）。 |\n| 持PR但不在澳洲居住 | 需要个案判断——ATO综合考虑居住意图、家庭和社会关系、经济联系等。 |\n| 中澳双重税务居民 | 中澳双边税务协定（DTA）可能减免重复征税，但申报义务不豁免。 |\n\n### 7.2 关键税种\n\n| 税种 | 税率 | 说明 |\n|---|---|---|\n| 个人所得税 | 0%-45%（累进） | 2024-25年澳洲居民免税额$18,200 |\n| Medicare Levy | 2%（应税收入） | 覆盖公共医疗，PR须缴纳 |\n| 资本利得税(CGT) | 按个人所得税率 | 持有>12个月可有50%折扣（个人） |\n| 印花税 | 各州不同 | 购房时缴纳，海外买家有附加税 |\n| 遗产税 | 无（澳洲无联邦遗产税） | 但有CGT递延规则 |\n\n### 7.3 税务风险边界\n\n- 澳洲对税务居民全球收入征税，但非税务居民只对澳洲来源收入征税。\n- PR不等于自动澳洲税务居民，但如果开始在澳长期居住，将触发税务居民身份。\n- 澳洲与中国有DTA（双边税务协定），可在一定程度上减免双重征税。\n- 高净值人士在成为澳洲税务居民前，应考虑资产重新定价（step-up）策略。\n\n---\n\n## 八、预算明细汇总\n\n### 8.1 路径A：NIV 858（国家创新签证）\n\n| 项目 | 金额/口径 | 是否必须 | 说明 |\n|---|---:|---|---|\n| 签证申请费 | AUD 4,425起（主申） | 必须 | 以移民局官网为准，随行成员另计。 |\n| 移民代理/律师费 | AUD 15,000-30,000 | 推荐 | MARA注册代理或移民律师。 |\n| 职业评估/资质认证 | AUD 500-1,500 | 可能需要 | 视专业领域。 |\n| Form 1000提名准备 | 视情况 | 必须 | 需澳大利亚个人或机构提名。 |\n| 体检费 | AUD 400-600/人 | 必须 | 指定医生。 |\n| 警察证明 | AUD 100-200 | 必须 | 各国无犯罪记录。 |\n| 英语考试费 | AUD 400 | 可能需豁免 | 如需满足功能性英语。 |\n\n### 8.2 路径B：482 SID→186 TRT（雇主担保）\n\n| 项目 | 金额/口径 | 是否必须 | 说明 |\n|---|---:|---|---|\n| 482 SID签证费 | AUD 1,500-3,000 | 必须 | 视签证时长。 |\n| 186签证费 | AUD 4,640起（主申） | 必须 | 永居阶段。 |\n| 雇主sponsorship费 | AUD 1,000-3,000 | 雇主承担 | SAF levy另计。 |\n| 移民代理/律师费 | AUD 15,000-25,000 | 推荐 | 全流程。 |\n| 职业评估费 | AUD 1,000-2,000 | 必须（DE流） | 如适用。 |\n| 体检+警察证明 | AUD 500-800/人 | 必须 | — |\n\n### 8.3 费用合计预估（人民币万元）\n\n> 汇率暂按 \`1 AUD = 4.80 RMB\`；实际以付款日汇率为准。以下按NIV 858主旨申请人家庭四人估算。\n\n| 费用类别 | 外币金额 | 折合人民币（万元） | 说明 |\n|---|---:|---:|---|\n| NIV签证申请费 | AUD 4,425（主申）+ 约AUD 6,000（配偶子女） | 5.00 | 政府官方费用。 |\n| 移民代理/律师费 | AUD 20,000 | 9.60 | 推荐全流程代理。 |\n| Form 1000提名 | 视提名人 | — | 取决于提名对象。 |\n| 体检+警察证明 | AUD 2,500（四人） | 1.20 | 按家庭估算。 |\n| 英语考试/豁免费 | AUD 5,000（如豁免） | 2.40 | 如未达标。 |\n| 国内公证/翻译 | 约RMB 15,000 | 1.50 | — |\n| **合计预估** | — | **~19.70** | NIV路径费用较低；与188C(AUD 500万投资)相比成本大幅降低。 |\n\n> 如走186雇主担保路径，加上482→186两个阶段费用，约AUD 25,000-40,000（约12-19万人民币）不含生活成本。\n\n---\n\n## 九、执行时间轴\n\n### 9.1 NIV 858标准执行路径\n\n| 时间 | 动作 | 责任方 | 交付物 |\n|---|---|---|---|\n| 第1-2周 | 客户背景评估：成就/行业/奖项/提名路径 | 顾问+客户 | 背景匹配评估 |\n| 第2-4周 | 联系提名机构/个人，准备Form 1000 | 客户+提名方 | 提名材料 |\n| 第4-6周 | 准备EOI和证据包：奖项、媒体报道、专利、推荐信 | 移民代理+客户 | EOI+证据包 |\n| 第6-8周 | 提交EOI，等待邀请（60天内需递交签证申请） | 移民代理 | EOI提交 |\n| 获邀后 | 递交签证申请（体检+警察证明+完整文件） | 移民代理+客户 | 签证申请回执 |\n| 递交后 | 等待审理（优先级取决于领域和提名层级） | 移民局 | 批准或补件通知 |\n| 获批 | 取得永居签证、登陆澳大利亚 | 客户 | PR签证 |\n\n### 9.2 本周立即行动清单\n\n| 编号 | 动作 | 目的 |\n|---|---|---|\n| 1 | 确认客户是否了解188已关停，是否接受"无投资移民"的现实 | 避免客户期望在已不存在的路径上 |\n| 2 | 评估客户职业/行业/成就背景：是否可能符合NIV 858？ | 确定主推路径 |\n| 3 | 评估客户是否能通过189/190打分测试（年龄+英语+职业+学历） | 确定备选路径 |\n| 4 | 如均不满足，推荐对比加拿大、新西兰等其他目的国 | 避免死磕澳洲 |\n\n---\n\n## 十、重要风险声明\n\n### 10.1 政策关停风险\n\n**BIIP 188系列已于2024年7月31日永久关停。任何声称"可办理澳洲投资移民188C/SIV"的近期宣传必须高度警惕，除非是针对2024年7月前已提交的积压申请。**\n\n### 10.2 NIV 858高门槛风险\n\n**NIV 858虽然无投资金额要求，但"国际公认杰出成就"标准极高。客户必须提供真实的国际奖项、行业领导地位证明、学术成果或商业成功记录。不是"有钱就能通过"。**\n\n### 10.3 雇主担保真实性风险\n\n**186/482都需要真实雇主和真实职位。虚假雇主、虚假薪资、虚假职位描述属于严重欺诈行为，可能面临永久禁入澳大利亚。**\n\n### 10.4 技术移民竞争风险\n\n**189/190 EOI打分竞争激烈，实际邀请分数（75-85+）远高于最低65分。英语、年龄、学历、工作经验每一项都影响最终分数。**\n\n### 10.5 国籍风险\n\n**入籍澳大利亚后根据中国国籍法自动丧失中国国籍。客户须在PR阶段明确是否最终要入籍。**\n\n---\n\n## 附件：引用法律法规与项目资料来源\n\n### A. 法律依据清单\n\n| 法案/规则 | 条款 | 本次用途 | 状态 |\n|---|---|---|---|\n| Migration Act 1958 (Cth) | — | 澳大利亚移民法上位法 | 现行有效 |\n| Migration Regulations 1994 | Schedule 1, Schedule 2 | 各类签证具体要求和申请流程 | 持续修订 |\n| 2024-25 Migration Program | — | 年度移民配额：BIIP仅1,000个（含积压处理） | 2024-25财年 |\n| NIV 858设立 | Legislative Instrument | 取代GTI 858，2024年12月6日生效 | 2024-12-06 |\n| 482 SID设立 | Legislative Instrument | 取代TSS 482，2024年12月7日生效 | 2024-12-07 |\n| CSOL（Core Skills Occupation List） | — | 186/482职业清单依据 | 持续更新 |\n| 《中华人民共和国国籍法》 | 第3条、第9条 | 双重国籍禁止 | 现行有效 |\n\n### B. 交付前客户需补充与确认资料\n\n1. 客户完整简历：教育、工作经历、行业、成就、奖项、媒体报道、推荐人。\n2. 家庭成员信息与年龄。\n3. 英语考试成绩或评估。\n4. 如有澳大利亚雇主/提名方联系信息。\n5. 过往所有国家的无犯罪记录。\n6. 由MARA注册移民代理/律师出具的最新技术评估和路径确认。\n";`;
